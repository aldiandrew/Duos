name: Build Optimized Duos APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Android 17 SDK
        run: |
          android --version
          android --sdk="${ANDROID_HOME}" sdk install --canary platforms/android-37

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew

      - name: Build optimized debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Report APK size
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Duos-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

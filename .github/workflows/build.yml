name: Duos Auto-Healing CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duos-auto-healing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and auto-heal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOHEAL_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAI SDK
        run: python -m pip install --disable-pip-version-check "openai>=1.0.0,<3"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        id: build
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug 2>&1 | tee build-error.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build-error.log
          if-no-files-found: warn

      - name: Auto-heal
        if: failure() && steps.build.outputs.exit_code != '0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTOHEAL_TOKEN: ${{ secrets.AUTOHEAL_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          OPENAI_MODEL: gpt-5
          MAX_AUTOHEAL_COMMITS: "5"
        run: python scripts/auto_heal.py

      - name: Verify APK
        if: success()
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Duos-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
